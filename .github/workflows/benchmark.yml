name: Benchmark

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: sbt/setup-sbt@v1
      - name: Build Scala.js bundles
        run: sbt before/fullOptJS after/fullOptJS
      - name: Measure bundles
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          before_js=before/target/scala-3.9.0/airstream-findupdate-before-opt/main.js
          after_js=after/target/scala-3.9.0/airstream-findupdate-after-opt/main.js
          for match_index in 0 128 255 -1; do
            before_result="before-${match_index}.json"
            after_result="after-${match_index}.json"
            bun benchmark.ts "$before_js" "$match_index" > "$before_result"
            bun benchmark.ts "$after_js" "$match_index" > "$after_result"
          done
      - name: Write summary
        run: >-
          bun report.ts
          before/target/scala-3.9.0/airstream-findupdate-before-opt/main.js
          after/target/scala-3.9.0/airstream-findupdate-after-opt/main.js
          before-0.json after-0.json before-128.json after-128.json
          before-255.json after-255.json before--1.json after--1.json
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated bundles and results
        uses: actions/upload-artifact@v4
        with:
          name: airstream-findupdate-benchmark
          path: |
            before/target/scala-3.9.0/airstream-findupdate-before-opt/main.js
            after/target/scala-3.9.0/airstream-findupdate-after-opt/main.js
            *-result.json
